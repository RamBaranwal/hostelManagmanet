name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: login to docker hub
      uses: docker/login-action@v2
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}
        
    - name: build backend docker image
      run: docker build -t rambaranwal/hostel-backend:latest ./backend
      
    - name: push backend docker image to docker hub
      run: docker push rambaranwal/hostel-backend:latest

    - name: build frontend docker image
      run: docker build -t rambaranwal/hostel-frontend:latest ./frontend
      
    - name: push frontend docker image to docker hub
      run: docker push rambaranwal/hostel-frontend:latest

